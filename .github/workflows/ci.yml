name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Start Postgres and Qdrant
        working-directory: .
        run: cp .env.example .env && docker compose up --detach --wait db qdrant
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: API reference is up to date
        working-directory: .
        run: python scripts/generate_api_reference.py --check
      - name: Security suite (tenant isolation, injection, revocation, audit, limits)
        run: pytest tests/security
        env:
          ATLAS_REQUIRE_STACK: "1"
      - name: Unit, ingestion, agent, migration and benchmark tests
        run: pytest -m "not integration" --ignore=tests/security
        env:
          ATLAS_REQUIRE_STACK: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Seed Acme and Nova
        run: docker compose run --rm migrate python -m app.db.manage seed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integration tests against the stack
        working-directory: backend
        run: |
          pip install -e '.[dev]'
          pytest -m integration
        env:
          ATLAS_REQUIRE_STACK: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: End-to-end UI tests (Playwright)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
